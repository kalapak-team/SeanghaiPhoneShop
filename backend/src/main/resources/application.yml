spring:
  application:
    name: SeanghaiPhoneShop
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/seanghai_phone_shop
    username: seanghai
    password: seanghai123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
